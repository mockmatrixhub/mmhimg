name: Watermark JPG Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watermark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install sharp

      - name: Watermark all .jpg files with logo.jpg
        run: |
          cat > watermark.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const ROOT = process.cwd();
          const LOGO_PATH = path.join(ROOT, 'logo.jpg');
          const OPACITY = 0.15;
          const ROTATION = 0;
          const QUALITY = 100;
          const BG_THRESHOLD = 45; // color-distance from detected background to treat as background

          function findJpgFiles(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                findJpgFiles(full, files);
              } else if (/\.jpe?g$/i.test(entry.name)) {
                if (full === LOGO_PATH) continue;
                files.push(full);
              }
            }
            return files;
          }

          // Detects the logo's background color from its corner pixels and makes
          // those pixels fully transparent, then bakes in the target opacity
          // for the remaining (actual artwork) pixels only.
          async function makeCleanLogo(logoBuffer, opacity) {
            const { data, info } = await sharp(logoBuffer)
              .ensureAlpha()
              .raw()
              .toBuffer({ resolveWithObject: true });
            const { width, height, channels } = info;

            const cornerIdx = [
              0,
              (width - 1) * channels,
              (height - 1) * width * channels,
              ((height - 1) * width + (width - 1)) * channels
            ];
            let br = 0, bg = 0, bb = 0;
            for (const idx of cornerIdx) {
              br += data[idx]; bg += data[idx + 1]; bb += data[idx + 2];
            }
            br /= 4; bg /= 4; bb /= 4;

            for (let i = 0; i < data.length; i += channels) {
              const dr = data[i] - br;
              const dg = data[i + 1] - bg;
              const db = data[i + 2] - bb;
              const dist = Math.sqrt(dr * dr + dg * dg + db * db);
              data[i + channels - 1] = dist < BG_THRESHOLD ? 0 : Math.round(255 * opacity);
            }

            return sharp(data, { raw: { width, height, channels } }).png().toBuffer();
          }

          async function watermarkOne(cleanLogoBuffer, filePath) {
            const image = sharp(filePath);
            const meta = await image.metadata();
            const w = meta.width;
            const h = meta.height;
            const shorterSide = Math.min(w, h);
            const targetSize = Math.round(shorterSide * 0.55);

            const logoMeta = await sharp(cleanLogoBuffer).metadata();
            const ratio = logoMeta.width > logoMeta.height
              ? targetSize / logoMeta.width
              : targetSize / logoMeta.height;
            const dw = Math.round(logoMeta.width * ratio);
            const dh = Math.round(logoMeta.height * ratio);

            const resizedLogo = await sharp(cleanLogoBuffer)
              .resize(dw, dh)
              .rotate(ROTATION, { background: { r: 0, g: 0, b: 0, alpha: 0 } })
              .toBuffer();

            const rotatedMeta = await sharp(resizedLogo).metadata();
            const left = Math.round((w - rotatedMeta.width) / 2);
            const top = Math.round((h - rotatedMeta.height) / 2);

            const outBuffer = await image
              .composite([{ input: resizedLogo, left, top }])
              .jpeg({ quality: QUALITY })
              .toBuffer();

            fs.writeFileSync(filePath, outBuffer);
            console.log(`Watermarked: ${path.relative(ROOT, filePath)}`);
          }

          async function main() {
            if (!fs.existsSync(LOGO_PATH)) {
              console.error('logo.jpg not found at repo root.');
              process.exit(1);
            }
            const rawLogoBuffer = fs.readFileSync(LOGO_PATH);
            const cleanLogoBuffer = await makeCleanLogo(rawLogoBuffer, OPACITY);
            const files = findJpgFiles(ROOT);
            console.log(`Found ${files.length} .jpg file(s) to watermark (excluding logo.jpg).`);
            for (const file of files) {
              try {
                await watermarkOne(cleanLogoBuffer, file);
              } catch (err) {
                console.error(`Failed on ${file}:`, err.message);
              }
            }
          }

          main();
          EOF
          node watermark.js

      - name: Commit watermarked images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.jpg' ':!logo.jpg' || true
          git add -A -- '*.jpeg' ':!logo.jpg' || true
          git diff --cached --quiet || git commit -m "Watermark all .jpg images with logo.jpg"
          git push
