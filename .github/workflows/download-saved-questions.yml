name: Download Saved Questions

on:
  workflow_dispatch:   # run manually from the Actions tab

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch saved_questions node from Firebase
        run: |
          curl -s "https://mmh-cgl-paid-full-mock-data-default-rtdb.firebaseio.com/saved_questions.json" \
            -o saved_questions.json

      - name: Commit JSON file to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saved_questions.json
          git diff --cached --quiet || git commit -m "Update saved_questions.json"
          git push
