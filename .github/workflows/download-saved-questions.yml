name: Download Saved Questions

on:
  workflow_dispatch:   # run manually from the Actions tab

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create a release
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch saved_questions node from Firebase
        run: |
          curl -s "https://mmh-cgl-paid-full-mock-data-default-rtdb.firebaseio.com/saved_questions.json" \
            -o saved_questions.json

      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="saved-questions-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" saved_questions.json \
            --title "Saved Questions Snapshot - $(date +%Y-%m-%d)" \
            --notes "Auto-generated snapshot of the saved_questions node"
